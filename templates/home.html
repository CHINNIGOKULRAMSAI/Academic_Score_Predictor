<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Exam Performance Predictor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card: #111827;
            --muted: #9ca3af;
            --text: #e5e7eb;
            --primary: #3b82f6;
            --primary-900: #1e40af;
            --accent: #10b981;
            --error: #ef4444;
            --border: #1f2937;
            --focus: 0 0 0 3px rgba(59, 130, 246, 0.35);
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, 'Helvetica Neue', Arial;
            background: radial-gradient(1000px 600px at 10% 10%, rgba(59, 130, 246, 0.08), transparent 60%),
                                    radial-gradient(800px 500px at 90% 15%, rgba(16, 185, 129, 0.08), transparent 60%),
                                    var(--bg);
            color: var(--text);
            display: grid;
            place-items: center;
            padding: 32px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .title {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 0.4px;
            background: linear-gradient(90deg, #93c5fd 0%, #d1fae5 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge {
            background: linear-gradient(90deg, var(--primary), var(--accent));
            color: white;
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 6px 18px rgba(59, 130, 246, 0.25);
        }

        .card {
            background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.0));
            border: 1px solid var(--border);
            border-radius: 18px;
            backdrop-filter: saturate(160%) blur(8px);
            box-shadow: 0 20px 60px rgba(2, 6, 23, 0.55);
            overflow: hidden;
        }

        .grid {
            display: grid;
            grid-template-columns: 1.35fr 0.65fr;
            gap: 0;
        }

        .panel {
            padding: 32px;
        }

        .panel + .panel {
            border-left: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.0));
        }

        .legend {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 18px;
            color: var(--text);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 18px;
        }

        .field { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 14px; color: var(--muted); }

        select, input[type="number"] {
            appearance: none;
            background: #0b1220;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 12px;
            padding: 12px 14px;
            outline: none;
            transition: border-color 180ms ease, box-shadow 180ms ease, transform 120ms ease;
        }
        select:focus, input[type="number"]:focus { border-color: var(--primary); box-shadow: var(--focus); }
        select:hover, input[type="number"]:hover { transform: translateY(-1px); }

        .actions { margin-top: 16px; display: flex; gap: 12px; }
        .btn {
            background: linear-gradient(90deg, var(--primary), #60a5fa);
            border: 1px solid var(--primary-900);
            color: white;
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 120ms ease, box-shadow 180ms ease;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 20px rgba(30, 64, 175, 0.35); }
        .btn:active { transform: translateY(0); }

        .result {
            background: linear-gradient(180deg, rgba(16,185,129,0.12), rgba(16,185,129,0.06));
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #d1fae5;
            padding: 16px 18px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 18px;
            display: inline-block;
        }

        .hint {
            margin-top: 8px;
            font-size: 12px;
            color: var(--muted);
        }

        @media (max-width: 860px) {
            .grid { grid-template-columns: 1fr; }
            .panel + .panel { border-left: none; border-top: 1px solid var(--border); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">Student Exam Performance Predictor</div>
            <div class="badge" style="font-size:13px">Academic • ML Pipeline • XGBoost</div>
        </div>

        <div class="card grid">
            <div class="panel">
                <div class="legend">Enter Student Details</div>
                <form action="{{ url_for('predict_datapoint')}}" method="post">
                    <div class="row">
                        <div class="field">
                            <label>Gender</label>
                            <select name="gender" required>
                                <option class="placeholder" selected disabled value="">Select Gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>
                        </div>
                        <div class="field">
                            <label>Race/Ethnicity</label>
                            <select name="race_ethnicity" required>
                                <option class="placeholder" selected disabled value="">Select Group</option>
                                <option value="group A">Group A</option>
                                <option value="group B">Group B</option>
                                <option value="group C">Group C</option>
                                <option value="group D">Group D</option>
                                <option value="group E">Group E</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="field">
                            <label>Parental Level of Education</label>
                            <select name="parental_level_of_education" required>
                                <option class="placeholder" selected disabled value="">Select Parent Education</option>
                                <option value="associate's degree">Associate's degree</option>
                                <option value="bachelor's degree">Bachelor's degree</option>
                                <option value="high school">High school</option>
                                <option value="master's degree">Master's degree</option>
                                <option value="some college">Some college</option>
                                <option value="some high school">Some high school</option>
                            </select>
                        </div>
                        <div class="field">
                            <label>Lunch Type</label>
                            <select name="lunch" required>
                                <option class="placeholder" selected disabled value="">Select Lunch Type</option>
                                <option value="free/reduced">Free/reduced</option>
                                <option value="standard">Standard</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="field">
                            <label>Test Preparation Course</label>
                            <select name="test_preparation_course" required>
                                <option class="placeholder" selected disabled value="">Select Course</option>
                                <option value="none">None</option>
                                <option value="completed">Completed</option>
                            </select>
                        </div>
                        <div class="field">
                            <label>Reading Score (0-100)</label>
                              <input type="number" name="reading_score" min="0" max="100" step="1" placeholder="e.g., 78" required />
                        </div>
                    </div>

                    <div class="row">
                        <div class="field">
                            <label>Writing Score (0-100)</label>
                              <input type="number" name="writing_score" min="0" max="100" step="1" placeholder="e.g., 85" required />
                        </div>
                        <div class="field" style="align-self: end;">
                            <div class="actions">
                                <button class="btn" type="submit" id="submitBtn">Predict Maths Score</button>
                            </div>
                            <div class="hint">Your data stays local to this session.</div>
                        </div>
                    </div>
                </form>
            </div>

            <div class="panel">
                <div class="legend">Prediction</div>
                {% if results is not none %}
                    <div class="result">Predicted Math Score: {{results}}</div>
                {% else %}
                    <div class="hint">Submit the form to see the predicted score.</div>
                {% endif %}
            </div>
        </div>
    </div>
    <script>
        const form = document.querySelector('form');
        const submitBtn = document.getElementById('submitBtn');
        if (form && submitBtn) {
            form.addEventListener('submit', () => {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Predicting…';
            });
        }
    </script>
</body>
</html>
